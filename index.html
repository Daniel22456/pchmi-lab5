<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЛР5 Прототип закупок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --night:#142233; --night2:#0E1824; --steel:#4A6A88; --burgundy:#6B1E36; --burgundy-light:#8E2A47;
  --amber:#B5832F; --brick:#B03A2E; --bottle:#2E6A50;
  --overcast:#E8ECF0; --paper:#FBFCFD; --ink:#1B2633; --muted:#5E6B7A; --rule:#C9D1DA;
  --pin:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 14px);
  --u:24px;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --bg:#E8ECF0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#DDE3E9}}
:root[data-theme="dark"]{--bg:#DDE3E9}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);font-size:16px;line-height:24px;background:var(--bg);color:var(--ink);min-height:100vh}
a{color:inherit}
button{font:inherit}
.ic{width:16px;height:16px;display:inline-block;vertical-align:-3px;flex:none}

/* ---------- полоса тестирования ---------- */
.testbar{position:sticky;top:0;z-index:60;background:var(--burgundy);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 16px;font-size:14px;line-height:24px}
.testbar b{font-weight:600}
.testbar .tb-task{flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.95}
.testbar .tb-time{font-variant-numeric:tabular-nums;opacity:.85}
.testbar button{height:36px;padding:0 14px;border:0;border-radius:2px;cursor:pointer;font-size:13px;font-weight:600}
.tb-show{background:rgba(255,255,255,.15);color:#fff}
.tb-done{background:#fff;color:var(--burgundy)}
.tb-skip{background:transparent;color:#F3D9E0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}

/* ---------- шапка и меню ---------- */
.hdr{background-color:var(--night);background-image:var(--pin);color:#fff;box-shadow:inset 0 -3px 0 var(--burgundy)}
.hdr-in{max-width:1200px;margin:0 auto;padding:var(--u) 16px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:16px;cursor:pointer;text-decoration:none;color:#fff;flex:none}
.mark{width:48px;height:48px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:22px}
.brand-name{font-family:var(--serif);font-weight:700;font-size:22px;line-height:24px}
.brand-sub{font-size:12px;line-height:24px;color:#9FB0C2}
.hsearch{flex:1;display:flex;height:48px;min-width:0;max-width:520px}
.hsearch input{flex:1;min-width:0;height:48px;border:0;padding:0 16px;font:15px/24px var(--sans);color:var(--ink)}
.hsearch button{border:0;background:var(--burgundy);color:#fff;padding:0 18px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
.hsearch input:focus{outline:2px solid var(--burgundy-light);outline-offset:-2px}
.uact{margin-left:auto;display:flex;align-items:center;gap:12px}
.ibtn{position:relative;width:48px;height:48px;display:grid;place-items:center;color:#D9E1EA;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);background:none;border:0;cursor:pointer}
.ibtn em{position:absolute;top:-6px;right:-6px;background:var(--burgundy-light);font:600 11px/16px var(--sans);font-style:normal;padding:0 5px;border-radius:8px;color:#fff}
.uchip{display:flex;align-items:center;gap:12px;font-size:12px;line-height:24px;color:#C9D4E0}
.uchip b{display:block;color:#fff;font-size:14px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--burgundy-light);display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px;flex:none}
.logout{background:none;border:0;color:#C9D4E0;cursor:pointer;font-size:12px;text-decoration:underline}
.nav{background:var(--paper);box-shadow:inset 0 -1px 0 var(--rule)}
.nav ul{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;list-style:none;overflow-x:auto;scrollbar-width:none}
.nav a{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px;text-decoration:none;font-size:15px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.nav a:hover{background:var(--overcast)}
.nav a.cur{box-shadow:inset 0 -3px 0 var(--burgundy);font-weight:600;color:var(--night)}
.nav a.off{color:#9AA5B1;cursor:not-allowed}
.nav a.ro::after{content:"просмотр";font-size:10px;line-height:16px;color:var(--muted);background:var(--overcast);padding:0 4px;border-radius:2px}

/* ---------- раскладка ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:var(--u) 16px 48px}
.crumbs{font-size:13px;line-height:24px;color:var(--muted);margin-bottom:var(--u)}
.crumbs a{cursor:pointer;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--u);align-items:start}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
.panel{background:var(--paper);box-shadow:inset 0 4px 0 var(--night);padding:var(--u)}
.panel.accent{box-shadow:inset 0 4px 0 var(--burgundy)}
.panel.steel{box-shadow:inset 0 4px 0 var(--steel)}
.panel.amber{box-shadow:inset 0 4px 0 var(--amber)}
.panel.green{box-shadow:inset 0 4px 0 var(--bottle)}
h1.t{font-family:var(--serif);font-weight:700;font-size:36px;line-height:48px;color:var(--night)}
h2.t{font-family:var(--serif);font-weight:700;font-size:28px;line-height:48px;color:var(--night)}
h3.t{font-family:var(--serif);font-weight:700;font-size:22px;line-height:24px;color:var(--night);margin-bottom:var(--u)}
.kicker{font-size:12px;line-height:24px;color:var(--muted);letter-spacing:.02em}
p.s{font-size:14px;line-height:24px;color:var(--muted)}
.mt{margin-top:var(--u)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}

.btn{display:inline-flex;align-items:center;gap:8px;height:48px;background:var(--night);color:#fff;border:0;box-shadow:inset 0 0 0 1px var(--night);border-radius:2px;font:600 15px/24px var(--sans);padding:0 22px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--burgundy);box-shadow:none}
.btn.ghost{background:transparent;color:var(--night)}
.btn.ghost:hover{background:var(--burgundy);color:#fff}
.btn.light{background:#fff;color:var(--night);box-shadow:none}
.btn.light:hover{background:var(--burgundy);color:#fff}
.btn.inv{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.btn.danger{background:var(--brick);box-shadow:none}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;background:#8A96A3;box-shadow:none;color:#fff}
.link{color:var(--burgundy);font-weight:600;cursor:pointer;text-decoration:none;background:none;border:0;font-size:14px}
.link:hover{text-decoration:underline}

/* формы */
.form{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--u)}
.fld{display:flex;flex-direction:column}
.fld label{font-size:13px;line-height:24px;font-weight:600;color:var(--night)}
.fld label i{font-style:normal;color:var(--brick)}
.fld input,.fld select,.fld textarea,.inp{height:48px;border:0;box-shadow:inset 0 0 0 1px var(--rule);background:#fff;padding:0 14px;font:15px/24px var(--sans);color:var(--ink);border-radius:0;width:100%}
.fld textarea{height:96px;padding:12px 14px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:2px solid var(--burgundy);outline-offset:-2px}
.fld .hint{font-size:12px;line-height:24px;color:var(--muted)}
.fld.err input,.fld.err select{box-shadow:inset 0 0 0 2px var(--brick)}
.fld .emsg{font-size:12px;line-height:24px;color:var(--brick);font-weight:600}
.files{list-style:none}
.files li{display:flex;justify-content:space-between;align-items:center;height:48px;box-shadow:inset 0 -1px 0 var(--rule);font-size:14px}
.files li .ic{margin-right:8px;color:var(--steel)}
.alertbox{padding:12px 16px 12px 20px;background:#F8E9E7;box-shadow:inset 4px 0 0 var(--brick);font-size:14px;line-height:24px;margin-bottom:var(--u)}
.okbox{padding:12px 16px 12px 20px;background:#E6F0EA;box-shadow:inset 4px 0 0 var(--bottle);font-size:14px;line-height:24px;margin-bottom:var(--u)}
.infobox{padding:12px 16px 12px 20px;background:#EEF2F6;box-shadow:inset 4px 0 0 var(--steel);font-size:14px;line-height:24px;margin-bottom:var(--u)}

/* таблицы */
table.list{width:100%;border-collapse:collapse;font-size:14px;line-height:24px}
table.list th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:12px 8px;box-shadow:inset 0 -1px 0 var(--rule);white-space:nowrap}
table.list td{padding:12px 8px;box-shadow:inset 0 -1px 0 var(--rule);vertical-align:top}
table.list td small{display:block;color:var(--muted);font-size:12px}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:#F1F4F7}
table.list tr.hl td{background:#FBF3E6}
.num{font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.st{display:inline-block;height:24px;font-size:11px;line-height:24px;font-weight:600;padding:0 8px;border-radius:2px;color:#fff;white-space:nowrap}
.st.apply{background:var(--steel)}.st.auction{background:var(--burgundy)}.st.review{background:var(--amber)}.st.results{background:#6B5B95}.st.done{background:var(--bottle)}.st.draft{background:#8A96A3}
.st.sent{background:var(--steel)}.st.adm{background:var(--bottle)}.st.rej{background:var(--brick)}.st.win{background:var(--bottle)}.st.wd{background:#8A96A3}
.tabs{display:flex;box-shadow:inset 0 -1px 0 var(--rule);margin-bottom:var(--u);overflow-x:auto}
.tabs a{display:flex;align-items:center;gap:6px;height:48px;padding:0 16px;font-size:14px;cursor:pointer;color:var(--muted);text-decoration:none;white-space:nowrap}
.tabs a.cur{box-shadow:inset 0 -3px 0 var(--burgundy);color:var(--night);font-weight:600}
.kv{display:grid;grid-template-columns:220px 1fr;font-size:14px;line-height:24px}
.kv div{padding:12px 0;box-shadow:inset 0 -1px 0 var(--rule)}
.kv div:nth-child(odd){color:var(--muted)}
ul.feed{list-style:none}
ul.feed li{padding:12px 0;box-shadow:inset 0 -1px 0 var(--rule);font-size:14px;line-height:24px}
ul.feed li small{display:block;color:var(--muted);font-size:12px}
ul.links{list-style:none}
ul.links li{display:flex;justify-content:space-between;align-items:center;gap:12px;height:48px;box-shadow:inset 0 -1px 0 var(--rule);font-size:14px}
ul.links li:last-child{box-shadow:none}
ul.links a{cursor:pointer;text-decoration:none}
ul.links a:hover{color:var(--burgundy);text-decoration:underline}
ul.links kbd{font:600 11px var(--sans);color:var(--muted)}

/* главная */
.hero{background-color:var(--night);background-image:var(--pin);color:#fff;padding:48px;box-shadow:inset 0 -3px 0 var(--burgundy)}
.hero .kicker{color:#9FB0C2}
.hero h1{font-family:var(--serif);font-weight:700;font-size:44px;line-height:48px;margin-bottom:var(--u)}
.hero p{color:#C9D4E0;max-width:62ch}
.card{background:#fff;box-shadow:inset 0 4px 0 var(--steel);padding:var(--u);display:flex;flex-direction:column;cursor:pointer}
.card:hover{background:#F7F9FB}
.card.b{box-shadow:inset 0 4px 0 var(--burgundy)}.card.a{box-shadow:inset 0 4px 0 var(--amber)}.card.g{box-shadow:inset 0 4px 0 var(--bottle)}
.card .big{font-family:var(--serif);font-weight:700;font-size:44px;line-height:48px;color:var(--night)}
.card .more{margin-top:auto;padding-top:var(--u);color:var(--burgundy);font-weight:600;font-size:14px}

/* аукцион */
.auc{background-color:var(--night);background-image:var(--pin);color:#fff;padding:var(--u) 48px 48px}
.auc .kicker{color:#9FB0C2}
.auc .big{font-family:var(--serif);font-weight:700;font-size:52px;line-height:72px;font-variant-numeric:tabular-nums}
.auc .stats{display:flex;flex-wrap:wrap;gap:24px 48px;margin-top:var(--u)}
.auc .stats b{display:block;font-size:20px;line-height:24px}
.auc .stats span{font-size:12px;color:#9FB0C2}

/* модальное окно, уведомления */
.modal-bg{position:fixed;inset:0;background:rgba(14,24,36,.55);display:flex;align-items:flex-start;justify-content:center;padding:72px 16px 16px;z-index:100;overflow:auto}
.modal{background:var(--paper);width:100%;max-width:560px;box-shadow:inset 0 4px 0 var(--burgundy),0 20px 60px rgba(0,0,0,.3);padding:var(--u)}
.modal.wide{max-width:860px}
.modal h3{font-family:var(--serif);font-weight:700;font-size:26px;line-height:48px;color:var(--night)}
.modal .mbody{font-size:15px;line-height:24px;margin:12px 0 var(--u)}
.modal .mbody p+p{margin-top:12px}
.modal .row{justify-content:flex-end}
.toast{position:fixed;right:16px;bottom:16px;z-index:120;background:var(--night);color:#fff;padding:12px 20px;font-size:14px;line-height:24px;box-shadow:inset 4px 0 0 var(--bottle),0 8px 24px rgba(0,0,0,.25);max-width:420px}
.toast.bad{box-shadow:inset 4px 0 0 var(--brick),0 8px 24px rgba(0,0,0,.25)}
.picker li{cursor:pointer}
.picker li:hover{background:#F1F4F7}
.doc{background:#fff;box-shadow:inset 0 0 0 1px var(--rule);padding:24px 32px;font-family:Georgia,serif;font-size:14px;line-height:24px;max-height:360px;overflow:auto}

/* стартовый экран и журнал */
.start-hero{background-color:var(--night);background-image:var(--pin);color:#fff;padding:48px}
.start-hero h1{font-family:var(--serif);font-size:44px;line-height:48px;margin:0 0 var(--u)}
.start-hero p{color:#C9D4E0;max-width:70ch}
.logtbl{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:20px;width:100%;border-collapse:collapse}
.logtbl td,.logtbl th{padding:4px 6px;box-shadow:inset 0 -1px 0 var(--rule);text-align:left;vertical-align:top;white-space:nowrap}
.logtbl td.w{white-space:normal;word-break:break-all;max-width:360px}
.logwrap{max-height:480px;overflow:auto;background:#fff;box-shadow:inset 0 0 0 1px var(--rule)}
.out-f{color:var(--brick);font-weight:600}
.fab{position:fixed;left:16px;bottom:16px;z-index:70;height:36px;padding:0 14px;border:0;border-radius:2px;background:var(--night);color:#fff;font:600 12px var(--sans);cursor:pointer;opacity:.85}
.fab:hover{opacity:1}
.foot{max-width:1200px;margin:0 auto;padding:0 16px 24px;font-size:12px;color:var(--muted)}

@media (max-width:900px){
  .c8,.c6,.c4,.c3{grid-column:span 12}
  .hsearch{display:none}
  .uchip .who{display:none}
  .hero,.start-hero{padding:24px}
  .hero h1,.start-hero h1{font-size:32px}
  .kv{grid-template-columns:1fr}
  .kv div:nth-child(odd){padding-bottom:0;box-shadow:none}
  .auc{padding:24px}
  table.list .hm{display:none}
}
</style>
</head>
<body>
<div id="testbar"></div>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
/* =====================================================================
   ИКОНКИ
   ===================================================================== */
function I(n){var P={
 search:'<circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6"/>',
 bell:'<path d="M8 2a4 4 0 0 0-4 4v3l-1.5 2h11L12 9V6a4 4 0 0 0-4-4zM6.5 12.5a1.5 1.5 0 0 0 3 0"/>',
 lock:'<rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/>',
 doc:'<path d="M3 1h7l3 3v11H3z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 8h5M5.5 10.5h5M5.5 5.5h2.5" stroke="currentColor" stroke-width="1.2"/>',
 clip:'<path d="M10.5 4.5L5 10a1.8 1.8 0 0 0 2.5 2.5L13 7a3.2 3.2 0 0 0-4.5-4.5L3 8" fill="none" stroke="currentColor" stroke-width="1.4"/>',
 x:'<path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6"/>'
};return '<svg class="ic" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">'+P[n]+'</svg>'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return n==null||n===''?'—':String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function parseMoney(s){var d=String(s||'').replace(/[^\d]/g,'');return d?parseInt(d,10):NaN}
var TODAY='16.11.2026';
function parseDate(s){var m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(s||'').trim());if(!m)return null;var d=new Date(+m[3],+m[2]-1,+m[1]);return d.getDate()==+m[1]&&d.getMonth()==+m[2]-1?d:null}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* =====================================================================
   МОДУЛЬ ФИКСАЦИИ СОБЫТИЙ (логгер)
   Формат записи соответствует методическим указаниям:
   timestamp, actor_id, actor_role, action, object_type, object_id,
   outcome, changes, context. Выгрузка: CSV, JSONL, PLAIN TEXT.
   ===================================================================== */
var LOG=(function(){
  var KEY='lr5_eventlog_v1';
  var all=[];
  try{all=JSON.parse(load(KEY)||'[]')}catch(e){all=[]}
  var ua=(function(){var u=navigator.userAgent,m=/(Edg|OPR|YaBrowser|Chrome|Firefox|Safari)\/(\d+)/.exec(u);return m?(m[1]+'/'+m[2]):'browser'})();
  var ctx={session_id:null,actor_id:'anon',actor_role:'guest',task_id:null,screen:null};
  var dbq=[];
  function persist(){store(KEY,JSON.stringify(all.slice(-20000)))}
  function rec(action,object_type,object_id,outcome,changes,extra){
    var e={
      timestamp:new Date().toISOString(),
      actor_id:ctx.actor_id, actor_role:ctx.actor_role,
      action:action, object_type:object_type||'ui', object_id:object_id==null?'':String(object_id),
      outcome:outcome||'success',
      changes:changes||null,
      context:Object.assign({session_id:ctx.session_id,correlation_id:ctx.session_id,task_id:ctx.task_id,screen:ctx.screen,user_agent:ua,seq:all.length+1},extra||{})
    };
    all.push(e);persist();
    if(window.__onLog)window.__onLog(e);
    return e;
  }
  function csvCell(v){if(v==null)return '';var s=typeof v==='string'?v:JSON.stringify(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
  function toCSV(list){
    var h='timestamp,actor_id,actor_role,action,object_type,object_id,outcome,changes,context';
    return [h].concat(list.map(function(e){return [e.timestamp,e.actor_id,e.actor_role,e.action,e.object_type,e.object_id,e.outcome,e.changes?JSON.stringify(e.changes):'',JSON.stringify(e.context)].map(csvCell).join(',')})).join('\n')+'\n';
  }
  function toJSONL(list){
    return list.map(function(e){var o={timestamp:e.timestamp,actor:{id:e.actor_id,role:e.actor_role},action:e.action,object:{type:e.object_type,id:e.object_id},outcome:e.outcome};if(e.changes)o.changes=e.changes;o.context=e.context;return JSON.stringify(o)}).join('\n')+'\n';
  }
  function toTXT(list){
    return list.map(function(e){
      var c=e.context||{},s=e.timestamp+'  actor='+e.actor_id+'  role='+e.actor_role+'  action='+e.action+'  object='+e.object_type+':'+(e.object_id||'-')+'  outcome='+e.outcome+'  task='+(c.task_id||'-')+'  screen='+(c.screen||'-')+'  ua="'+c.user_agent+'"  corr='+(c.correlation_id||'-');
      if(e.changes)Object.keys(e.changes).forEach(function(k){var v=e.changes[k];s+='  change.'+k+'="'+(v&&typeof v==='object'&&'old' in v?String(v.old)+'->'+String(v.new):String(v).replace(/"/g,'\''))+'"'});
      ['error','detail','value'].forEach(function(k){if(c[k]!=null)s+='  '+k+'='+JSON.stringify(c[k])});
      return s;
    }).join('\n')+'\n';
  }
  return {
    ctx:ctx, rec:rec, all:function(){return all},

function sessions(){
  var m={},order=[];
  LOG.all().forEach(function(e){var c=e.context||{};if(!c.session_id||String(c.session_id).indexOf('S')!==0)return;
    var s=m[c.session_id];if(!s){s=m[c.session_id]={sid:c.session_id,actor:e.actor_id,exp:'',pc:'',tasks:0,ok:0,time:0,n:0,starts:{}};order.push(s)}
    s.n++;
    if(e.action==='session_start'){s.actor=e.actor_id;s.exp=(e.changes&&e.changes.experience)||'';s.pc=(e.changes&&e.changes.pc_level)||''}
    if(e.action==='task_start')s.starts[c.task_id]=Date.parse(e.timestamp);
    if(e.action==='task_end'){s.tasks++;if(e.outcome==='success')s.ok++;if(s.starts[c.task_id])s.time+=(Date.parse(e.timestamp)-s.starts[c.task_id])/1000}
  });
  return order;
}
function countSessions(){return sessions().length}

function startTask(i){
  var t=TASKS[i];S.test.i=i;S.test.goal=false;

function endTask(outcome){
  var t=TASKS[S.test.i],ok=t.done();
  var res=outcome==='abandoned'?'abandoned':(ok?'success':'failure');
  LOG.rec('task_end','task',t.id,res,null,{detail:outcome==='abandoned'?'Испытуемый отказался от выполнения':(ok?'Цель задания достигнута':'Испытуемый завершил задание, цель не достигнута'),duration_s:+((Date.now()-S.test.t0)/1000).toFixed(3)});
  var evs=LOG.session(LOG.ctx.session_id).filter(function(e){return e.context.task_id===t.id});
  dbWrite('sessions/'+LOG.ctx.session_id+'/tasks/'+t.id,{session_id:LOG.ctx.session_id,actor_id:LOG.ctx.actor_id,task_id:t.id,outcome:res,events:evs});
  LOG.ctx.task_id=null;
  if(S.test.i+1<TASKS.length)showTaskIntro(S.test.i+1);
  else finishSession();
}

function download(name,data,mime){
  function anchor(){var b=new Blob(['﻿'+data],{type:mime+';charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(function(d){if(d)return d.save({filename:name,data:data}).then(function(){toast('Файл '+name+' сохранён')},function(){toast('Сохранение отменено',true)});anchor()}).catch(anchor);
  }else anchor();
}
